name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      FIREBASE_PROJECT_ID: asheq-ullah-rafiq-digital-p
      FIREBASE_HOSTING_SITE_ID: asheq-ullah-rafiq-digital-p

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for Admin Panel
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal-source/web-admin/package-lock.json

      - name: Install dependencies and build Admin Panel
        working-directory: portal-source/web-admin
        run: |
          npm ci
          npm run build

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: asheq-ullah-rafiq-digital-p
          workload_identity_provider: projects/982402541543/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: ${{ vars.FIREBASE_HOSTING_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify authentication setup
        run: |
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Google credentials were not configured."
            exit 1
          fi

          if [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Credentials file does not exist."
            exit 1
          fi

          echo "Google credentials file exists."

      - name: Set up Node.js for Firebase Deploy
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Deploy Firebase Hosting
        working-directory: portal-source
        run: |
          npx --yes firebase-tools@15.22.3 deploy \
            --only hosting \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
